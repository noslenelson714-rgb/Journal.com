<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal · protected</title>
    <link rel="icon" type="image/jpeg" href="N.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf0f8;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            color: #3d2a3a;
        }

        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #faf0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #lockScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lock-box {
            background: white;
            border-radius: 40px;
            padding: 3rem 3.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(200, 80, 170, 0.15), 0 8px 24px rgba(180, 50, 140, 0.08);
            border: 1px solid rgba(200, 80, 170, 0.12);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lock-box .lock-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .lock-box h2 {
            font-weight: 500;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #d474c0, #b85a9e, #9f4b88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .lock-box p {
            color: #b08aa6;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .lock-box .password-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #fcf5fa;
            color: #3d2a3a;
        }

        .lock-box .password-input:focus {
            border-color: #c85a9e;
            box-shadow: 0 0 0 4px rgba(200, 90, 158, 0.15);
            transform: scale(1.01);
        }

        .lock-box .password-input::placeholder {
            color: #b08aa6;
        }

        .lock-box .unlock-btn {
            margin-top: 1rem;
            width: 100%;
            padding: 0.8rem;
            background: #d474c0;
            border: none;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .lock-box .unlock-btn:hover {
            background: #c25a9e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 80, 170, 0.3);
        }

        .lock-box .unlock-btn:active {
            transform: translateY(0);
        }

        .lock-box .unlock-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        .lock-box .unlock-btn:hover::after {
            transform: scale(1);
        }

        .lock-box .error-msg {
            color: #d474c0;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            min-height: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(-5px);
        }

        .lock-box .error-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        .blog-card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(200, 80, 170, 0.15), 0 8px 24px rgba(180, 50, 140, 0.08);
            padding: 2.8rem 3rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(200, 80, 170, 0.12);
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blog-card:hover {
            box-shadow: 0 24px 60px rgba(200, 80, 170, 0.18);
            transition: 0.3s ease;
        }

        .blog-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0d6e8;
            padding-bottom: 1.2rem;
        }

        .blog-header h1 {
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #d474c0, #b85a9e, #9f4b88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            animation: shimmer 3s ease-in-out infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .search-section {
            margin-bottom: 2rem;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            background: #f8ecf5;
            padding: 0.5rem 1.6rem;
            border-radius: 60px;
            border: 1px solid #e8cce0;
            transition: all 0.3s ease;
        }

        .search-wrapper:focus-within {
            border-color: #d474c0;
            box-shadow: 0 0 0 4px rgba(200, 80, 170, 0.08);
        }

        .search-wrapper .label {
            font-weight: 400;
            color: #7a4a6e;
            letter-spacing: 0.4px;
            font-size: 0.9rem;
        }

        .search-input {
            flex: 1;
            min-width: 160px;
            background: #ffffff;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #3d2a3a;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.2px;
        }

        .search-input::placeholder {
            color: #b08aa6;
            font-weight: 300;
        }

        .search-input:focus {
            border-color: #c85a9e;
            box-shadow: 0 0 0 4px rgba(200, 90, 158, 0.12);
            background: #fffafd;
            transform: scale(1.01);
        }

        .search-btn {
            background: #d474c0;
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1.6rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .search-btn:hover {
            background: #c25a9e;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(200, 80, 170, 0.25);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        .search-btn:hover::after {
            transform: scale(1);
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #7a4a6e;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .clear-btn:hover {
            background: #f0d6e8;
            border-color: #c85a9e;
            transform: translateY(-2px);
        }

        .calendar-wrapper {
            position: relative;
            display: inline-block;
        }

        .calendar-toggle {
            background: transparent;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
            color: #7a4a6e;
        }

        .calendar-toggle:hover {
            background: #f0d6e8;
            border-color: #c85a9e;
            transform: scale(1.05);
        }

        .sort-select {
            background: #ffffff;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.5rem 1.1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #3d2a3a;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sort-select:hover {
            border-color: #c85a9e;
        }

        .sort-select:focus {
            border-color: #c85a9e;
            box-shadow: 0 0 0 4px rgba(200, 90, 158, 0.12);
        }

        .calendar-popup {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: white;
            border-radius: 24px;
            padding: 1.2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(200, 80, 170, 0.08);
            border: 1px solid #e8cce0;
            z-index: 100;
            min-width: 280px;
            animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .calendar-popup.active {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-header .month-year {
            font-weight: 500;
            color: #3d2a3a;
            font-size: 1rem;
        }

        .calendar-header button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #7a4a6e;
            transition: all 0.2s ease;
        }

        .calendar-header button:hover {
            background: #f0d6e8;
            transform: scale(1.1);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .calendar-grid .weekday {
            font-size: 0.7rem;
            font-weight: 500;
            color: #b08aa6;
            text-transform: uppercase;
            padding: 0.3rem 0;
        }

        .calendar-grid .day {
            padding: 0.5rem 0;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #3d2a3a;
            transition: all 0.2s ease;
        }

        .calendar-grid .day:hover {
            background: #f0d6e8;
            transform: scale(1.05);
        }

        .calendar-grid .day.selected {
            background: #d474c0;
            color: white;
            font-weight: 500;
            transform: scale(1.05);
        }

        .calendar-grid .day.empty {
            cursor: default;
            color: transparent;
        }

        .calendar-grid .day.has-entry {
            font-weight: 500;
            color: #a14f8a;
            position: relative;
        }

        .calendar-grid .day.has-entry::after {
            content: '•';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            color: #d474c0;
            font-size: 0.6rem;
        }

        .calendar-grid .day.selected.has-entry::after {
            color: white;
        }

        .calendar-popup .quick-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #f0d6e8;
        }

        .calendar-popup .quick-links button {
            background: #f8ecf5;
            border: 1px solid #e8cce0;
            border-radius: 30px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            color: #7a4a6e;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calendar-popup .quick-links button:hover {
            background: #d474c0;
            color: white;
            border-color: #d474c0;
            transform: scale(1.05);
        }

        .blog-content {
            margin: 2rem 0 2.5rem 0;
        }

        .entry-item {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #f0d6e8;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transition: all 0.3s ease;
        }

        .entry-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .entry-item:hover {
            transform: translateX(4px);
            transition: 0.2s ease;
        }

        .entry-item .entry-date {
            font-weight: 500;
            color: #7a4a6e;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            display: block;
            background: #f8ecf5;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid #e8cce0;
            transition: all 0.3s ease;
        }

        .entry-item:hover .entry-date {
            background: #f0d6e8;
            border-color: #d474c0;
        }

        .entry-item .entry-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #2d1b2b;
            white-space: pre-wrap;
            word-break: break-word;
            padding-left: 0.5rem;
        }

        .empty-state {
            text-align: center;
            color: #b08aa6;
            font-style: italic;
            padding: 2rem 0;
            font-weight: 300;
            animation: fadeIn 0.5s ease;
        }

        .footer-line {
            margin-top: 2.8rem;
            border-top: 1px solid #f0d6e8;
            padding-top: 1.5rem;
        }

        .panel-toggle-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.4rem;
        }

        .panel-toggle-row button {
            background: transparent;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.5rem 1.4rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #7a4a6e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .panel-toggle-row button:hover {
            background: #f0d6e8;
            border-color: #c85a9e;
            transform: translateY(-2px);
        }

        .panel-toggle-row button.active {
            background: #d474c0;
            color: #ffffff;
            border-color: #d474c0;
        }

        .add-panel {
            display: none;
            background: #f8ecf5;
            border: 1px solid #e8cce0;
            border-radius: 28px;
            padding: 1.5rem 1.7rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .add-panel.active {
            display: block;
        }

        .add-panel label {
            font-size: 0.78rem;
            color: #7a4a6e;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 0.5rem;
        }

        .add-panel input[type="date"],
        .add-panel textarea {
            width: 100%;
            border: 1px solid #dbb0d2;
            border-radius: 20px;
            padding: 0.7rem 1.1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #3d2a3a;
            background: #ffffff;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 1.1rem;
            resize: vertical;
        }

        .add-panel textarea {
            min-height: 130px;
            line-height: 1.7;
        }

        .add-panel input:focus,
        .add-panel textarea:focus {
            border-color: #c85a9e;
            box-shadow: 0 0 0 4px rgba(200, 90, 158, 0.12);
        }

        .panel-save-btn {
            background: #d474c0;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.7rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .panel-save-btn:hover {
            background: #c25a9e;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(200, 80, 170, 0.25);
        }

        .panel-status {
            font-size: 0.82rem;
            color: #7a4a6e;
            margin-top: 0.6rem;
            min-height: 1.2rem;
        }

        .feedback-item {
            background: #ffffff;
            border: 1px solid #f0d6e8;
            border-radius: 20px;
            padding: 1rem 1.3rem;
            margin-bottom: 0.9rem;
        }

        .feedback-item:last-child {
            margin-bottom: 0;
        }

        .feedback-item .feedback-meta {
            font-size: 0.75rem;
            color: #b08aa6;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .feedback-item .feedback-text {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #2d1b2b;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .entry-feedback-toggle {
            background: transparent;
            border: 1px solid #dbb0d2;
            border-radius: 40px;
            padding: 0.35rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            color: #7a4a6e;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.9rem;
        }

        .entry-feedback-toggle:hover {
            background: #f0d6e8;
            border-color: #c85a9e;
        }

        .entry-feedback-panel {
            display: none;
            margin-top: 1rem;
            background: #f8ecf5;
            border: 1px solid #e8cce0;
            border-radius: 20px;
            padding: 1.1rem 1.3rem;
        }

        .entry-feedback-panel.active {
            display: block;
        }

        .entry-feedback-panel input[type="text"],
        .entry-feedback-panel textarea {
            width: 100%;
            border: 1px solid #dbb0d2;
            border-radius: 16px;
            padding: 0.6rem 0.9rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #3d2a3a;
            background: #ffffff;
            outline: none;
            transition: all 0.3s ease;
            margin-top: 0.6rem;
            margin-bottom: 0.8rem;
            resize: vertical;
        }

        .entry-feedback-panel textarea {
            min-height: 90px;
            line-height: 1.6;
        }

        .entry-feedback-panel input:focus,
        .entry-feedback-panel textarea:focus {
            border-color: #c85a9e;
            box-shadow: 0 0 0 4px rgba(200, 90, 158, 0.12);
        }

        .entry-feedback-submit {
            background: #d474c0;
            border: none;
            border-radius: 40px;
            padding: 0.45rem 1.3rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .entry-feedback-submit:hover {
            background: #c25a9e;
            transform: translateY(-2px);
        }

        .entry-feedback-list {
            margin-bottom: 0.8rem;
        }

        .entry-feedback-empty {
            font-size: 0.85rem;
            color: #b08aa6;
            font-style: italic;
            margin-bottom: 0.8rem;
        }

        @media (max-width: 550px) {
            .blog-card {
                padding: 1.8rem 1.2rem;
                border-radius: 32px;
            }
            .lock-box {
                padding: 2rem 1.5rem;
            }
            .blog-header h1 {
                font-size: 1.8rem;
            }
            .search-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
                border-radius: 32px;
                padding: 1rem 1.2rem;
            }
            .search-input {
                width: 100%;
            }
            .sort-select {
                width: 100%;
            }
            .search-btn,
            .clear-btn {
                width: 100%;
                text-align: center;
            }
            .calendar-popup {
                left: 50%;
                transform: translateX(-50%);
                min-width: 260px;
            }
            .entry-item .entry-text {
                font-size: 1rem;
                padding-left: 0;
            }
            .panel-toggle-row {
                flex-direction: column;
            }
            .panel-toggle-row button {
                width: 100%;
                text-align: center;
            }
            .add-panel,
            .entry-feedback-panel {
                padding: 1.2rem 1.2rem;
            }
        }

        ::selection {
            background: #dba6cc;
            color: #2c0f25;
        }
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="lock-box">
            <span class="lock-icon">🔒</span>
            <h2>protected journal</h2>

            function base64ToBuffer(b64) {
                const binary = atob(b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes.buffer;
            }

            function bufferToBase64(buf) {
                const bytes = new Uint8Array(buf);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            async function deriveKey(password) {
                const encoder = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
                );
                return crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: base64ToBuffer(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            async function encryptText(key, plaintext) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encoder = new TextEncoder();
                const ctBuf = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    encoder.encode(plaintext)
                );
                return { iv: bufferToBase64(iv), ct: bufferToBase64(ctBuf) };
            }

            async function decryptText(key, iv, ct) {
                const decoder = new TextDecoder();
                const plainBuf = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: base64ToBuffer(iv) },
                    key,
                    base64ToBuffer(ct)
                );
                return decoder.decode(plainBuf);
            }

            function getLocalEntries() {
                try {
                    return JSON.parse(localStorage.getItem(LOCAL_ENTRIES_KEY) || '{}');
                } catch (err) {
                    return {};

            function setLocalEntries(obj) {
                try {
                    localStorage.setItem(LOCAL_ENTRIES_KEY, JSON.stringify(obj));
                } catch (err) {
                    return;
                }
            }

            function getLocalFeedback() {
                try {
                    return JSON.parse(localStorage.getItem(LOCAL_FEEDBACK_KEY) || '[]');
                } catch (err) {
                    return [];
                }
            }

            function setLocalFeedback(arr) {
                try {
                    localStorage.setItem(LOCAL_FEEDBACK_KEY, JSON.stringify(arr));
                } catch (err) {
                    return;
                }
            }

            async function decryptAllEntries(key) {
                const result = {};
                for (const date in encryptedEntries) {
                    const { iv, ct } = encryptedEntries[date];
                    result[date] = await decryptText(key, iv, ct);
                }
                const local = getLocalEntries();
                for (const date in local) {
                    try {
                        result[date] = await decryptText(key, local[date].iv, local[date].ct);
                    } catch (err) {
                        continue;
                    }
                }
                return result;
            }

            async function decryptAllFeedback(key) {
                const result = [];
                for (const item of encryptedFeedback) {
                    const raw = await decryptText(key, item.iv, item.ct);
                    try {
                        result.push(JSON.parse(raw));
                    } catch (err) {
                        continue;
                    }
                }
                for (const item of getLocalFeedback()) {
                    try {
                        const raw = await decryptText(key, item.iv, item.ct);
                        result.push(JSON.parse(raw));
                    } catch (err) {
                        continue;
                    }
                }
                return result;
            }

            let currentViewDate = new Date(now0.getFullYear(), now0.getMonth(), 1);
            let selectedDate = now0.toISOString().slice(0, 10);

            async function unlock() {
                const input = passwordInput.value;
                try {
                    const key = await deriveKey(input);
                    entries = await decryptAllEntries(key);
                    feedbackItems = await decryptAllFeedback(key);
                    cryptoKey = key;
                    passwordInput.value = '';
                    lockScreen.classList.add('hidden');
                    const todayStr = new Date().toISOString().slice(0, 10);
                    selectedDate = todayStr;
                    searchInput.value = todayStr;
                    newEntryDate.value = todayStr;
                    renderEntries(todayStr);
                    buildCalendar(currentViewDate.getFullYear(), currentViewDate.getMonth());
                    setTimeout(() => searchInput.focus(), 300);
                } catch (err) {
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                    setTimeout(() => {
                        errorMsg.classList.remove('show');
                    }, 3000);
                }
            }

            function buildEntryItemHtml(date, text) {
                const fbForDate = feedbackItems
                    .filter(item => item.date === date)
                    .sort((a, b) => (a.ts < b.ts ? 1 : -1));

                let fbListHtml = '';
                if (fbForDate.length === 0) {
                    fbListHtml = `<div class="entry-feedback-empty">no feedback yet</div>`;
                } else {
                    fbForDate.forEach(item => {
                        const when = new Date(item.ts).toLocaleString();
                        fbListHtml += `
                            <div class="feedback-item">
                                <div class="feedback-meta">${escapeHtml(item.name || 'Anonymous')} · ${escapeHtml(when)}</div>
                                <div class="feedback-text">${escapeHtml(item.text)}</div>
                            </div>
                        `;
                    });
                }

                const isOpen = openFeedbackDate === date;
                const countLabel = fbForDate.length ? ` (${fbForDate.length})` : '';

                return `
                    <div class="entry-item">
                        <span class="entry-date">${escapeHtml(date)}</span>
                        <div class="entry-text">${escapeHtml(text)}</div>
                        <button type="button" class="entry-feedback-toggle" data-date="${escapeHtml(date)}">💬 feedback${countLabel}</button>
                        <div class="entry-feedback-panel ${isOpen ? 'active' : ''}" data-date="${escapeHtml(date)}">
                            <div class="entry-feedback-list">${fbListHtml}</div>
                            <input type="text" class="entry-feedback-name" placeholder="Name (optional)">
                            <textarea class="entry-feedback-text" placeholder="Leave a note about this entry..."></textarea>
                            <button type="button" class="entry-feedback-submit" data-date="${escapeHtml(date)}">submit feedback</button>
                            <div class="panel-status entry-feedback-status"></div>
                        </div>
                    </div>
                `;
            }

            function attachEntryFeedbackHandlers() {
                entriesList.querySelectorAll('.entry-feedback-toggle').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const date = this.dataset.date;
                        openFeedbackDate = (openFeedbackDate === date) ? null : date;
                        entriesList.querySelectorAll('.entry-feedback-panel').forEach(panel => {
                            panel.classList.toggle('active', panel.dataset.date === openFeedbackDate);
                        });
                    });
                });

                entriesList.querySelectorAll('.entry-feedback-submit').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const date = this.dataset.date;
                        const container = this.closest('.entry-feedback-panel');
                        const nameInput = container.querySelector('.entry-feedback-name');
                        const textInput = container.querySelector('.entry-feedback-text');
                        const statusEl = container.querySelector('.entry-feedback-status');
                        const text = textInput.value.trim();
                        if (!text) {
                            statusEl.textContent = 'write something first';
                            return;
                        }
                        const name = nameInput.value.trim() || 'Anonymous';
                        const item = { date, name, text, ts: new Date().toISOString() };
                        const cipher = await encryptText(cryptoKey, JSON.stringify(item));
                        const local = getLocalFeedback();
                        local.push(cipher);
                        setLocalFeedback(local);
                        feedbackItems.push(item);
                        openFeedbackDate = date;
                        renderEntries(searchInput.value);
                    });
                });
            }

            function renderEntryList(dates) {
                let html = '';
                dates.forEach(date => {
                    html += buildEntryItemHtml(date, entries[date]);
                });
                entriesList.innerHTML = html;
                attachEntryFeedbackHandlers();
            }

            function getSortedDates() {
                const dates = Object.keys(entries);
                if (sortMode === 'oldest') {
                    return dates.sort();
                }
                if (sortMode === 'feedback') {
                    return dates.sort((a, b) => {
                        const countA = feedbackItems.filter(item => item.date === a).length;
                        const countB = feedbackItems.filter(item => item.date === b).length;
                        if (countB !== countA) {
                            return countB - countA;
                        }
                        return b.localeCompare(a);
                    });
                }
                return dates.sort().reverse();
            }

            function renderEntries(query) {
                if (!query || query.trim() === '') {
                    showAllEntries();
                    return;
                }

                const trimmed = query.trim();
                const sortedDates = getSortedDates();

                let filteredDates = [];

                if (/^\d{4}$/.test(trimmed)) {
                    filteredDates = sortedDates.filter(date => date.startsWith(trimmed));
                } else if (/^\d{4}-\d{2}$/.test(trimmed)) {
                    filteredDates = sortedDates.filter(date => date.startsWith(trimmed));
                } else if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
                    filteredDates = sortedDates.filter(date => date === trimmed);
                } else {
                    filteredDates = sortedDates.filter(date => date.includes(trimmed));
                }

                if (filteredDates.length === 0) {
                    entriesList.innerHTML = `<div class="empty-state">✎ no entries found for "${escapeHtml(trimmed)}"</div>`;
                    return;
                }

                renderEntryList(filteredDates);
            }

            function showAllEntries() {
                const sortedDates = getSortedDates();
                if (sortedDates.length === 0) {
                    entriesList.innerHTML = `<div class="empty-state">📖 no entries yet. start writing.</div>`;
                    return;
                }

                renderEntryList(sortedDates);
            }

            function buildCalendar(year, month) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                const todayStr = today.toISOString().slice(0, 10);

                let html = '';
                const weekdays = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
                weekdays.forEach(d => {
                    html += `<div class="weekday">${d}</div>`;
                });

                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="day empty"></div>`;
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const hasEntry = entries[dateStr] ? 'has-entry' : '';
                    const isSelected = selectedDate === dateStr ? 'selected' : '';
                    const isToday = dateStr === todayStr ? 'selected' : '';

                    html += `
                        <div class="day ${hasEntry} ${isSelected || isToday}" data-date="${dateStr}">${day}</div>
                    `;
                }

                calendarGrid.innerHTML = html;

                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                    'October', 'November', 'December'
                ];
                monthYearDisplay.textContent = `${monthNames[month]} ${year}`;

                document.querySelectorAll('.calendar-grid .day:not(.empty)').forEach(el => {
                    el.addEventListener('click', function() {
                        const date = this.dataset.date;
                        if (date) {
                            selectedDate = date;
                            searchInput.value = date;
                            renderEntries(date);
                            calendarPopup.classList.remove('active');
                            buildCalendar(currentViewDate.getFullYear(), currentViewDate.getMonth());
                        }
                    });
                });
            }

            function updateCalendar(delta) {
                const newDate = new Date(currentViewDate);
                newDate.setMonth(newDate.getMonth() + delta);
                currentViewDate = newDate;
                buildCalendar(currentViewDate.getFullYear(), currentViewDate.getMonth());
            }

            calendarToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                calendarPopup.classList.toggle('active');
                if (calendarPopup.classList.contains('active')) {
                    const now = new Date();
                    currentViewDate = new Date(now.getFullYear(), now.getMonth(), 1);
                    buildCalendar(currentViewDate.getFullYear(), currentViewDate.getMonth());
                }
            });

            document.addEventListener('click', function(e) {
                if (!calendarPopup.contains(e.target) && e.target !== calendarToggle) {
                    calendarPopup.classList.remove('active');
                }
            });

            prevMonthBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                updateCalendar(-1);
            });

            nextMonthBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                updateCalendar(1);
            });

            document.querySelectorAll('.quick-links button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.dataset.view;
                    const now = new Date();
                    let query = '';

                    if (view === 'today') {
                        query = now.toISOString().slice(0, 10);
                    } else if (view === 'month') {
                        query = now.toISOString().slice(0, 7);
                    } else if (view === 'year') {
                        query = now.toISOString().slice(0, 4);
                    }

                    searchInput.value = query;
                    renderEntries(query);
                    calendarPopup.classList.remove('active');
                });
            });

            searchBtn.addEventListener('click', function() {
                const query = searchInput.value;
                renderEntries(query);
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = searchInput.value;
                    renderEntries(query);
                }
            });

            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                selectedDate = null;
                showAllEntries();
            });

            sortModeSelect.addEventListener('change', function() {
                sortMode = this.value;
                renderEntries(searchInput.value);
            });

            toggleAddPanelBtn.addEventListener('click', function() {
                const willOpen = !addPanel.classList.contains('active');
                addPanel.classList.toggle('active', willOpen);
                toggleAddPanelBtn.classList.toggle('active', willOpen);
                if (willOpen) {
                    newEntryText.focus();
                }
            });

            saveEntryBtn.addEventListener('click', async function() {
                const date = newEntryDate.value;
                const text = newEntryText.value.trim();
                if (!date || !text) {
                    addPanelStatus.textContent = 'add a date and some text first';
                    return;
                }
                const cipher = await encryptText(cryptoKey, text);
                const local = getLocalEntries();
                local[date] = cipher;
                setLocalEntries(local);
                entries[date] = text;
                newEntryText.value = '';
                addPanelStatus.textContent = 'saved permanently';
                selectedDate = date;
                searchInput.value = date;
                renderEntries(date);
                buildCalendar(currentViewDate.getFullYear(), currentViewDate.getMonth());
            });

            passwordInput.focus();
        })();
    </script>
</body>
</html>
